<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: check-in calendar first (the thing to glance at), then the dated study log, then notes grouped by topic. */
:root{
  --bg:#f3f5f7;--panel:#ffffff;--ink:#16202b;--muted:#5b6876;--line:#cfd6de;
  --accent:#0f6f8f;--accent-soft:#e2f0f5;--accent-2:#7cc0d6;--empty:#e8ecf0;--hl:#d1365a;
  --f-display:"IBM Plex Sans Condensed","Noto Sans SC",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0f141a;--panel:#161d25;--ink:#e3e9ef;--muted:#93a1b0;--line:#2b3642;
  --accent:#4fb6d6;--accent-soft:#13303b;--accent-2:#2a6f86;--empty:#1d2630;--hl:#ff6f8f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-block:44px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:2.2rem;font-weight:700}
h2{font-size:1.3rem;font-weight:600}
section{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.stats{display:flex;flex-wrap:wrap;gap:10px 28px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

.months{display:flex;flex-direction:column;gap:16px}
.month{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.month header{display:flex;justify-content:space-between;align-items:baseline}
.month h3{font-size:1rem}
.month .count{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-variant-numeric:tabular-nums}
.track-wrap{overflow-x:auto;padding-bottom:2px}
.track{--n:30;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(18px,1fr));min-width:calc(var(--n) * 18px)}
.track::before{content:"";position:absolute;left:calc(50% / var(--n));right:calc(50% / var(--n));top:9px;height:2px;background:var(--line)}
.tick{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:10px;height:10px;margin-top:5px;border-radius:50%;background:var(--panel);border:2px solid var(--line);box-sizing:border-box}
.tick.on .dot{width:20px;height:20px;margin-top:0;background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tick.today .dot{border-color:var(--hl)}
.tick.today.on .dot{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--hl)}
.tick.future .dot{border-style:dashed;opacity:.5}
.num{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.tick.on .num{color:var(--accent);font-weight:600}
.tick.today .num{color:var(--hl);font-weight:600}
.tick.wk .num{opacity:.6}
button.tick{all:unset;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
button.tick:hover .dot{transform:scale(1.12)}
button.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.dot{transition:transform .15s}
.tick.sel .dot{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.entry{scroll-margin-top:24px;border-radius:6px;transition:background .3s}
.entry.flash{background:var(--accent-soft)}
.notes a{transition:border-color .3s,background .3s}
.notes a.flash{border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:96px 1fr;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.entry:last-child{border-bottom:1px solid var(--line)}
.entry time{font-family:var(--f-mono);font-size:.82rem;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:2px}
.entry ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
@media (max-width:480px){.entry{grid-template-columns:1fr}}

.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.notes a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 16px;color:var(--ink);text-decoration:none}
.notes a:hover,.notes a:focus-visible{border-color:var(--accent);outline:none}
.notes .t{font-weight:600}
.notes time{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:center}
.notes small{grid-column:1/-1;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <header style="display:flex;flex-direction:column;gap:8px">
    <div class="eyebrow">moepoison · 学习打卡</div>
    <h1>Learning Notes</h1>
  </header>

  <section>
    <div class="stats" id="stats"></div>
    <div class="months" id="months"></div>
    <p class="hint">点蓝色的日子，高亮那天学过的笔记。</p>
  </section>

  <section>
    <h2>学习日志</h2>
    <div class="log" id="log"></div>
  </section>

  <section>
    <h2>mini-sglang</h2>
    <ul class="notes" id="notes"></ul>
  </section>
</main>

<script>
/* ===== 打卡数据：每学一天加一条 ===== */
const LOG = [
  {date:"2026-11-09", items:["克隆 mini-sglang，读请求链路","画出请求流程图，建好 learning-notes repo 和 GitHub Pages"]},
  {date:"2026-11-10", items:["开始读 scheduler：Req、normal_loop","torch.inference_mode、DISABLE_OVERLAP_SCHEDULING"]},
  {date:"2026-11-11", items:["CUDA stream：scheduler stream vs engine stream","wait_stream（厨房比喻）"]},
  {date:"2026-11-12", items:["pin_memory、Event.synchronize，整理 Overlap 笔记","Req 练习表：cached_len / device_len / extend_len","请求结束：释放座位、KV 进 radix 树，table_idx 是什么","dataclass、__post_init__、Python 3.10 语法"]},
  {date:"2026-11-15", items:["API server：wait_for_ack、ZMQ vs RabbitMQ、asyncio 唤醒链、async 基础","开始用费曼学习法；DecodeManager、remain_len","模型怎么回答（自回归）、token 生成四站、Llama 怎么接进 mini-sglang"]},
];
/* 一篇笔记可以覆盖好几天：parts 记录「哪天学的 → 笔记里哪一节」 */
const NOTES = [
  {href:"mini-sglang/request-map.html", title:"一个请求在 Mini-SGLang 里走过的路", sub:"交互式请求流程图 + 9 课学习路线",
   parts:[{date:"2026-11-09", anchor:"", label:"全文"}]},
  {href:"mini-sglang/overlap-mechanics.html", title:"Overlap 的底层机制", sub:"inference_mode · CUDA stream · wait_stream · pin_memory · Event",
   parts:[{date:"2026-11-10", anchor:"#s01", label:"inference_mode"},
          {date:"2026-11-10", anchor:"#s02", label:"DISABLE_OVERLAP"},
          {date:"2026-11-11", anchor:"#s03", label:"CUDA stream"},
          {date:"2026-11-11", anchor:"#s04", label:"wait_stream"},
          {date:"2026-11-12", anchor:"#s05", label:"pin_memory"},
          {date:"2026-11-12", anchor:"#s06", label:"Event.synchronize"}]},
  {href:"mini-sglang/req-and-generation.html", title:"从 Req 到下一个 token", sub:"Req 练习表 · 请求结束 · DecodeManager · 生成链 · Llama 怎么接进来",
   parts:[{date:"2026-11-12", anchor:"#s01", label:"Req 练习表"},
          {date:"2026-11-12", anchor:"#s02", label:"请求结束、table_idx"},
          {date:"2026-11-15", anchor:"#s03", label:"DecodeManager"},
          {date:"2026-11-15", anchor:"#s04", label:"模型怎么回答"},
          {date:"2026-11-15", anchor:"#s05", label:"token 生成四站"},
          {date:"2026-11-15", anchor:"#s06", label:"Llama 怎么接进来"}]},
  {href:"mini-sglang/async-and-messaging.html", title:"API Server 的异步与消息", sub:"ZMQ vs RabbitMQ · 收发室模式 · asyncio 唤醒链 · async 基础",
   parts:[{date:"2026-11-15", anchor:"", label:"全文"}]},
];
const noteDates = n => [...new Set(n.parts.map(p => p.date))].sort();

const pad = n => String(n).padStart(2,"0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const studied = new Set(LOG.map(e => e.date));
const today = new Date();
const todayKey = key(today);

/* stats */
const thisMonth = todayKey.slice(0,7);
const monthCount = [...studied].filter(d => d.startsWith(thisMonth)).length;
let streak = 0;
{ const d = new Date(today); if (!studied.has(key(d))) d.setDate(d.getDate()-1);
  while (studied.has(key(d))) { streak++; d.setDate(d.getDate()-1); } }
document.getElementById("stats").innerHTML = [
  [monthCount, `本月学习天数（${today.getMonth()+1} 月）`],
  [studied.size, "累计学习天数"],
  [streak, "当前连续天数"],
  [NOTES.length, "笔记篇数"],
].map(([n,l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

/* calendars: every month from the first log entry to the current month, newest first */
const first = new Date(LOG[0].date + "T00:00:00");
const months = [];
for (let y = today.getFullYear(), m = today.getMonth(); ; ) {
  months.push([y,m]);
  if (y === first.getFullYear() && m === first.getMonth()) break;
  m--; if (m < 0) { m = 11; y--; }
}
document.getElementById("months").innerHTML = months.map(([y,m]) => {
  const days = new Date(y, m+1, 0).getDate();
  const prefix = `${y}-${pad(m+1)}`;
  const count = [...studied].filter(d => d.startsWith(prefix)).length;
  let ticks = "";
  for (let d = 1; d <= days; d++) {
    const k = `${prefix}-${pad(d)}`;
    const dow = new Date(y, m, d).getDay();
    const cls = ["tick",
      studied.has(k) ? "on" : "",
      k === todayKey ? "today" : "",
      k > todayKey ? "future" : "",
      dow === 0 || dow === 6 ? "wk" : ""].join(" ");
    ticks += studied.has(k)
      ? `<button type="button" class="${cls}" data-date="${k}" title="${k} · 已打卡，点击查看"><span class="dot"></span><span class="num">${d}</span></button>`
      : `<div class="${cls}" title="${k}"><span class="dot"></span><span class="num">${d}</span></div>`;
  }
  return `<div class="month"><header><h3>${y} 年 ${m+1} 月</h3><span class="count">${count} / ${days} 天</span></header><div class="track-wrap"><div class="track" style="--n:${days}">${ticks}</div></div></div>`;
}).join("");

/* log, newest first */
document.getElementById("log").innerHTML = [...LOG].reverse().map(e => {
  return `<div class="entry" id="d-${e.date}"><time>${e.date}</time><ul>${e.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
}).join("");

/* notes, newest first */
document.getElementById("notes").innerHTML = [...NOTES]
  .sort((a, b) => noteDates(b).at(-1).localeCompare(noteDates(a).at(-1)))
  .map(n => {
    const ds = noteDates(n);
    const range = ds.length > 1 ? `${ds[0].slice(5)} – ${ds.at(-1).slice(5)}` : ds[0].slice(5);
    return `<li><a href="${n.href}" data-dates="${ds.join(" ")}"><span class="t">${n.title}</span><time>${range}</time><small>${n.sub}</small></a></li>`;
  }).join("");

/* click a studied day → jump to that day's log and highlight it and its notes */
function focusDay(date, scroll = true) {
  document.querySelectorAll(".tick.sel").forEach(t => t.classList.remove("sel"));
  document.querySelectorAll(".entry.flash, .notes a.flash").forEach(el => el.classList.remove("flash"));
  document.querySelectorAll(`.tick[data-date="${date}"]`).forEach(t => t.classList.add("sel"));
  const hits = [...document.querySelectorAll(`.notes a[data-dates~="${date}"]`)];
  hits.forEach(a => a.classList.add("flash"));
  const entry = document.getElementById("d-" + date);
  if (entry) entry.classList.add("flash");
  const target = hits[0] || entry;     // 优先跳到当天的笔记；那天没笔记就跳到日志
  if (scroll && target) target.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center"});
  history.replaceState(null, "", "#d-" + date);
}
document.getElementById("months").addEventListener("click", e => {
  const t = e.target.closest("button.tick");
  if (t) focusDay(t.dataset.date);
});
if (location.hash.startsWith("#d-")) focusDay(location.hash.slice(3), false);
</script>
</body>
</html>
